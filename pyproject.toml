[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tools"
version = "0.1.0"
description = "Deterministic tools for AI agents: write a short spec instead of generating the output."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ankit Sharma" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["ai-agents", "llm", "tools", "charts", "svg", "token-efficient"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Visualization",
]

[project.optional-dependencies]
png = ["cairosvg>=2.5"]

[project.scripts]
agent-tools = "agent_tools.cli:main"

[project.urls]
Homepage = "https://github.com/ankit22sharma/agent-tools"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["USAGE.md"]
