[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jigstore"
version = "0.1.0"
description = "Deterministic tools for AI agents: write a short spec instead of generating the output."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ankit Sharma" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["ai-agents", "llm", "tools", "charts", "svg", "token-efficient"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
  "Topic :: Scientific/Engineering :: Visualization",
]

[project.optional-dependencies]
png = ["cairosvg>=2.5"]

[project.scripts]
jigstore = "jigstore.cli:main"

[project.urls]
Homepage = "https://github.com/jigstore/jigstore"
Issues = "https://github.com/jigstore/jigstore/issues"
Changelog = "https://github.com/jigstore/jigstore/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["USAGE.md", "py.typed"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["E731", "S603", "S607", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"scripts/*" = ["S"]
