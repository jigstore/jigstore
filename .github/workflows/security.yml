name: security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Blocks PRs that add a dependency with a known vulnerability or a copyleft license.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0

  # Lints the workflows themselves: injection from PR titles, unpinned actions, excess permissions.
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1

  # A longer fuzz run than the one in the unit tests, with a fresh seed each time.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install .
      - name: Fuzz the renderer
        env:
          JIGSTORE_FUZZ_N: "20000"
        run: |
          export JIGSTORE_FUZZ_SEED=$RANDOM
          echo "seed $JIGSTORE_FUZZ_SEED (rerun locally with this value)"
          python -m unittest tests.test_fuzz -v
